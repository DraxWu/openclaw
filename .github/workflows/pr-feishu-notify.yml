name: PR Feishu notify

on:
  pull_request:
    types: [opened, reopened, synchronize, closed, ready_for_review, converted_to_draft]

permissions:
  contents: read
  pull-requests: read

jobs:
  notify:
    if: ${{ secrets.FEISHU_PR_WEBHOOK_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Compute merge-base diff
        id: diff
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          git diff "$BASE...$HEAD" > /tmp/pr.diff
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD" >> "$GITHUB_OUTPUT"

      - name: Send structured Feishu notification
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_PR_WEBHOOK_URL }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_ACTION: ${{ github.event.action }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ steps.diff.outputs.base }}
          HEAD_SHA: ${{ steps.diff.outputs.head }}
        run: node scripts/feishu-pr-notify.mjs
